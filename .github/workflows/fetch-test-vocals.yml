name: Fetch test vocals (CC BY datasets -> test-vocals branch)

# Manual only: Actions tab -> "Fetch test vocals" -> "Run workflow".
# Downloads vocadito, Dagstuhl ChoirSet and VocalSet from Zenodo (all CC BY 4.0), verifies checksums,
# selects a balanced subset (tools/testdata/fetch_vocals.py) and commits it as FLAC with manifest.csv and
# ATTRIBUTION.md to the orphan branch `test-vocals` (main stays small). Set "survey" to only list the
# archive contents.
on:
  workflow_dispatch:
    inputs:
      survey:
        description: "Only list the archive contents"
        type: boolean
        default: false
      only:
        description: "Datasets to (re)build, comma-separated (empty = all); the others already on test-vocals are kept"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Start from the current test-vocals branch (if any)
        if: ${{ inputs.only != '' }}
        run: |
          git clone --depth 1 --branch test-vocals "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/out" || mkdir -p "$RUNNER_TEMP/out"
          rm -rf "$RUNNER_TEMP/out/.git"

      - name: Download, verify, select, convert
        run: |
          python3 tools/testdata/fetch_vocals.py "$RUNNER_TEMP/dl" "$RUNNER_TEMP/out" ${{ inputs.survey && '--survey' || '' }} "--only=${{ inputs.only }}"

      - name: Commit to the test-vocals branch
        if: ${{ ! inputs.survey }}
        run: |
          set -e
          cd "$RUNNER_TEMP/out"
          cat > README.md <<'EOF'
          # Kural test vocals

          Real singing recordings used to test Kural's pitch analysis and pitch shifting.
          Generated by `tools/testdata/fetch_vocals.py` on `main` (workflow "Fetch test vocals").
          See ATTRIBUTION.md for sources and licences, manifest.csv for the track list.

          - `audio/*.flac`: 16-bit mono
          - `f0/*.csv`: reference pitch (`time_s,f0_hz`, 0 = unvoiced) where the dataset has one
          EOF
          sed -i 's/^          //' README.md
          git init -q -b test-vocals
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Test vocals from vocadito, Dagstuhl ChoirSet and VocalSet (CC BY 4.0) - built from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin test-vocals
          du -sh .git
